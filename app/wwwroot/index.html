<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Banco Andino · Consola de seguridad</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- Pantalla de acceso -->
  <section id="login" class="login">
    <div class="login-card">
      <div class="brand">
        <div class="logo">BA</div>
        <div>
          <h1>Banco Andino</h1>
          <p class="muted">Consola de seguridad · SQL Server</p>
        </div>
      </div>

      <form id="form-login" autocomplete="off">
        <label>Usuario
          <input id="usuario" name="usuario" placeholder="ana" required />
        </label>
        <label>Contraseña
          <input id="password" name="password" type="password" placeholder="••••••••" required />
        </label>
        <button class="primary" type="submit">Ingresar</button>
        <p id="login-error" class="error" hidden></p>
      </form>

      <details class="demo">
        <summary>Usuarios de prueba</summary>
        <table>
          <thead><tr><th>Usuario</th><th>Clave</th><th>Rol</th></tr></thead>
          <tbody>
            <tr><td>ana</td><td>Cajero_Ana2026!</td><td>Cajero</td></tr>
            <tr><td>luis</td><td>Super_Luis2026!</td><td>Supervisor</td></tr>
            <tr><td>maria</td><td>Riesgos_Maria2026!</td><td>Riesgos</td></tr>
            <tr><td>sofia</td><td>Audit_Sofia2026!</td><td>Auditor</td></tr>
            <tr><td>admin</td><td>Dba_Admin2026!</td><td>DBA</td></tr>
          </tbody>
        </table>
      </details>
    </div>
  </section>

  <!-- Panel -->
  <div id="app" hidden>
    <header class="topbar">
      <div class="brand small">
        <div class="logo">BA</div>
        <div>
          <strong>Banco Andino</strong>
          <p class="muted" id="ctx-linea">—</p>
        </div>
      </div>
      <div class="topbar-right">
        <span id="chip-usuario" class="chip">—</span>
        <button id="btn-salir" class="ghost">Salir</button>
      </div>
    </header>

    <div class="layout">
      <nav id="nav" class="nav"></nav>
      <main id="vista" class="vista"></main>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
